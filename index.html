<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelipper Town Wiki</title>
<meta name="description" content="A data-driven wiki generated from the supplied Pelipper Town JSON dataset and README.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
    <a class="brand" href="#/"><span class="brand-mark">PT</span><span>Pelipper Town <small>Wiki</small></span></a>
    <div class="search-wrap">
      <label class="sr-only" for="search">Search the wiki</label>
      <input id="search" autocomplete="off" placeholder="Search Pokémon, villagers, trainers, locations…">
      <kbd>/</kbd>
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="nav"></nav>
    </aside>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>
<script src="wiki-data.js"></script>
<script src="docs-data.js"></script>
<script src="items-data.js"></script>
<script src="third-party-data.js"></script>
<script src="app.js"></script>
</body>
</html>
